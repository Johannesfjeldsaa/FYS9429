name: fys9429

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # --- Packaging ---
  - pip=24.3.1
  - setuptools=72.1.0
  - wheel=0.43.0

  # --- Core scientific stack ---
  - numpy
  - scipy
  - pandas

  # --- Climate / earth science ---
  - xarray
  - netcdf4
  - h5netcdf
  - cftime
  - nc-time-axis
  - xesmf

  # --- Jupyter ---
  - jupyterlab
  - notebook
  - ipykernel
  - ipywidgets

  # --- Visualisation ---
  - matplotlib
  - seaborn
  - cartopy
  - cmocean

  # --- Machine learning & statistics ---
  - statsmodels
  - scikit-learn

  # --- Dev tooling ---
  - pytest
  - black
  - flake8
  - isort
  - mypy

  # --- pip-only packages ---
  - pip:
      - "ray[tune]"

      # PyTorch CUDA 12.1 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu126

      - torch
      - torchvision
      - torchaudio